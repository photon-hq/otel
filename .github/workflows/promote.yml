name: Promote to production

on:
  workflow_dispatch:
    inputs:
      staging_version:
        type: string
        default: ""
        description: Staging version to promote (blank promotes the current staging tag)

permissions:
  contents: read

jobs:
  promote:
    uses: photon-hq/buildspace/.github/workflows/package-promote.yml@c138cb2dd12f5a7bf613458fd8d81cad8b0fd7ff
    permissions:
      contents: write
      packages: read
      actions: read
      attestations: read
      id-token: write
    with:
      registry: https://registry.npmjs.org
      package: "@photon-ai/otel"
      staging-version: ${{ inputs.staging_version }}
