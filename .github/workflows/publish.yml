name: Publish staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Verify and pack only

permissions:
  contents: read

concurrency:
  group: publish-staging
  cancel-in-progress: false

jobs:
  stage:
    uses: photon-hq/buildspace/.github/workflows/package-stage.yml@c138cb2dd12f5a7bf613458fd8d81cad8b0fd7ff
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: write
      id-token: write
    with:
      registry: https://registry.npmjs.org
      package: "@photon-ai/otel"
      ci-workflow: ci.yml
      bun-version: latest
      install: bun install --frozen-lockfile
      verify: bun x ultracite check && bun run test
      pack: bun scripts/pack-release.ts
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
